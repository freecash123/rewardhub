name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          cd frontend
          npm install
      - name: Build
        run: |
          cd frontend
          npm run build
      - name: Fix payments bug (if needed)
        run: |
          # If build fails, rewrite payments page with proper formatting
          if [ ! -d "frontend/out" ]; then
            cat > frontend/src/app/payments/page.tsx << 'ENDPAGE'
'./... payments fix script'
            cd frontend && npm run build
          fi
      - uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: frontend/out
          github_token: ${{ secrets.GITHUB_TOKEN }}